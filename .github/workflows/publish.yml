name: Publish Package to npm

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: |
          bun lint
          bun test
          bun run build

  changepacks:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    outputs:
      changepacks: ${{ steps.changepacks.outputs.changepacks }}
      pending_releases: ${{ steps.changepacks.outputs.pending_releases }}
    steps:
      - uses: actions/checkout@v7
      # Only select release targets here. Actual npm publication runs in a
      # fresh checkout, outside the action's historical-release checkout.
      - uses: changepacks/action@main
        id: changepacks
        with:
          publish: false

  publish:
    needs: changepacks
    if: contains(fromJSON(needs.changepacks.outputs.changepacks || '[]'), 'package.json')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm Trusted Publisher must match this repository and `publish.yml`.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm >= 11.5.1 (OIDC Trusted Publishing)
        run: npm install -g npm@latest
      # Build explicitly above; publishing must not rerun the Husky prepare hook.
      # npm performs the OIDC exchange without a long-lived npm token.
      - name: Validate npm package
        run: npm publish --access public --ignore-scripts --dry-run
      - name: Publish to npm
        run: npm publish --access public --ignore-scripts

  finalize-release:
    needs: [changepacks, publish]
    if: needs.changepacks.outputs.pending_releases != '' && needs.changepacks.outputs.pending_releases != '{}'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Finalize any draft left by an earlier failed built-in publication only
      # after npm succeeds. This job can be retried without republishing npm.
      - uses: changepacks/action@main
        with:
          finalize_releases: ${{ needs.changepacks.outputs.pending_releases }}
